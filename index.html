<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mimi and the Bell Flower</title>
<style>
  html, body { margin: 0; height: 100%; background: #15110F; overflow: hidden; }
  canvas { display: block; position: absolute; inset: 0; margin: auto; }
</style>
</head>
<body>
<script type="module">
  import * as THREE from './vendor/three.module.js';
  import { createFilm, DURATION } from './src/film.js';

  const params = new URLSearchParams(location.search);
  const renderMode = params.has('render');
  const W = +params.get('w') || 1920, H = +params.get('h') || 1080;

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: renderMode });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const film = createFilm(renderer);

  function fit() {
    // Letterbox to 16:9.
    const vw = renderMode ? W : innerWidth, vh = renderMode ? H : innerHeight;
    const w = Math.min(vw, vh * 16 / 9), h = w * 9 / 16;
    renderer.setPixelRatio(renderMode ? 1 : Math.min(devicePixelRatio, 2));
    renderer.setSize(w, h);
    film.camera.aspect = 16 / 9;
    film.camera.updateProjectionMatrix();
  }
  fit();

  window.DURATION = DURATION;
  window.film = film;
  window.renderAt = (t, cam) => { globalThis.DEBUG_CAM = cam || null; film.renderAt(t); };

  if (renderMode) {
    film.renderAt(+params.get('t') || 0);
    window.ready = true;
  } else {
    addEventListener('resize', fit);
    let paused = false, t = +params.get('t') || 0, last = performance.now();
    addEventListener('keydown', (e) => { if (e.code === 'Space') paused = !paused; });
    addEventListener('pointerdown', () => (paused = !paused));
    renderer.setAnimationLoop((now) => {
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      if (!paused) t = (t + dt) % (DURATION + 1); // 1 s hold on the last frame
      film.renderAt(Math.min(t, DURATION));
    });
  }
</script>
</body>
</html>
